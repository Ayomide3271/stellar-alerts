name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package (@stellar-alerts/shared)
        run: npx tsc -p packages/shared/tsconfig.json

      - name: Typecheck Backend (apps/api)
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Typecheck Frontend (apps/web)
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Run Vitest Unit Tests
        run: npm run test:api

      - name: Build Web Application
        run: npm run build --workspace=web
        env:
          NEXTAUTH_SECRET: "ci-build-dummy-secret-key-12345"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
